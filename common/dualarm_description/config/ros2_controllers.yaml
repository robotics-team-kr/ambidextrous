controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

left_arm_controller:
  ros__parameters:
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    joints:
      - left_panda_joint1
      - left_panda_joint2
      - left_panda_joint3
      - left_panda_joint4
      - left_panda_joint5
      - left_panda_joint6
      - left_panda_joint7

right_arm_controller:
  ros__parameters:
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    joints:
      - right_panda_joint1
      - right_panda_joint2
      - right_panda_joint3
      - right_panda_joint4
      - right_panda_joint5
      - right_panda_joint6
      - right_panda_joint7

# The hands are plain trajectory controllers on finger_joint1 (finger_joint2 mimics it).
# Closing = commanding 0.0: the finger stalls on the object and keeps squeezing with
# the joint effort limit, which is what holds the cube. No goal tolerance is set, so a
# stalled close still reports success; the pick & place code checks the finger gap itself.
left_hand_controller:
  ros__parameters:
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    joints:
      - left_panda_finger_joint1

right_hand_controller:
  ros__parameters:
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    joints:
      - right_panda_finger_joint1
